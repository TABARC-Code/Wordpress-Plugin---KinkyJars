name: Release
# On every push to main: if the plugin's Version has no release yet, run the checks, build the
# zips and publish release v<Version>. kink-jars.zip keeps the same name every time, so
# .../releases/latest/download/kink-jars.zip always gets the newest. Re-runs are harmless.
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Read version
        id: v
        run: echo "version=$(grep -oE '^ \* Version: +[0-9.]+' kink-jars/kink-jars.php | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')" >> "$GITHUB_OUTPUT"
      - name: Check for an existing release
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.v.outputs.version }}" >/dev/null 2>&1; then echo "found=yes" >> "$GITHUB_OUTPUT"; else echo "found=no" >> "$GITHUB_OUTPUT"; fi
      - name: Check and build
        if: steps.exists.outputs.found == 'no'
        run: |
          command -v php >/dev/null || { sudo apt-get update && sudo apt-get install -y php-cli; }
          php tests/unit.php
          bash tests/check-package.sh
      - name: Publish
        if: steps.exists.outputs.found == 'no'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ steps.v.outputs.version }}"
          notes=$(awk "/^= $v =/{f=1;next} /^= /{f=0} f" kink-jars/readme.txt)
          gh release create "v$v" dist/kink-jars.zip "dist/kink-jars-$v.zip" --target "$GITHUB_SHA" --title "Kink Jars for WordPress $v" \
            --notes "$(printf 'Download **kink-jars.zip** below and follow the [step-by-step guide](https://github.com/TABARC-Code/Wordpress-Plugin---KinkyJars/blob/main/INSTALL.md).\n\nDo not use the "Source code" downloads: WordPress will reject them.\n\n## Changes\n%s' "$notes")"
