name: Tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: PHP available
        run: command -v php >/dev/null || { sudo apt-get update && sudo apt-get install -y php-cli; }
      - name: Unit checks
        run: php tests/unit.php
      - name: Package checks (versions, zip layout)
        run: bash tests/check-package.sh
      - name: Real WordPress, real browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          node tests/e2e.cjs dist/kink-jars.zip
